remnawave:
  schema_document_type: json
  schema_url: https://cdn.remna.st/docs/openapi.json
  errors_schema_url: https://raw.githubusercontent.com/luwqz1/remna-api-errors-spec/refs/heads/main/schema.min.json
  schema:
    enums:
    - alpn:
        name: ALPN
        members:
          - H3
          - H2
          - HTTP_1_1
          - H_COMBINED
          - H3_H2_H1_COMBINED
          - H3_H2_COMBINED
        values:
          - h3
          - h2
          - http/1.1
          - h2,http/1.1
          - h3,h2,http/1.1
          - h3,h2
        description: Application-Layer Protocol Negotiation.
        member_descriptions:
          H3: HTTP/3 only.
          H2: HTTP/2 only.
          HTTP_1_1: HTTP/1.1 only.
          H_COMBINED: Combined HTTP/2 and HTTP/1.1 ALPN.
          H3_H2_H1_COMBINED: Combined HTTP/3, HTTP/2, and HTTP/1.1 ALPN.
          H3_H2_COMBINED: Combined HTTP/3 and HTTP/2 ALPN.
    - template_type:
        name: TemplateType
        members:
          - XRAY_JSON
          - XRAY_BASE64
          - MIHOMO
          - STASH
          - CLASH
          - SINGBOX
        values:
          - XRAY_JSON
          - XRAY_BASE64
          - MIHOMO
          - STASH
          - CLASH
          - SINGBOX
        description: Type of template configuration for `Xray-Core`, `mihomo`, etc.
        member_descriptions:
          XRAY_JSON: Xray template in JSON format.
          XRAY_BASE64: Xray template as Base64-encoded content.
          MIHOMO: Template for Mihomo clients.
          STASH: Template for Stash clients.
          CLASH: Template for Clash clients.
          SINGBOX: Template for Singbox clients.
    - client_type:
        name: ClientType
        members:
          - STASH
          - SINGBOX
          - MIHOMO
          - JSON
          - V2RAY_JSON
          - CLASH
        values:
          - stash
          - singbox
          - mihomo
          - json
          - v2ray-json
          - clash
        description: Client type of subscription.
        member_descriptions:
          STASH: Subscription for Stash client.
          SINGBOX: Subscription for Singbox client.
          MIHOMO: Subscription for Mihomo client.
          JSON: Subscription in JSON format.
          V2RAY_JSON: Subscription in V2Ray JSON format.
          CLASH: Subscription for Clash client.
    - conditions_operator:
        name: ConditionsOperator
        members:
          - EQUALS
          - NOT_EQUALS
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - NOT_STARTS_WITH
          - ENDS_WITH
          - NOT_ENDS_WITH
          - REGEX
          - NOT_REGEX
        values:
          - EQUALS
          - NOT_EQUALS
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - NOT_STARTS_WITH
          - ENDS_WITH
          - NOT_ENDS_WITH
          - REGEX
          - NOT_REGEX
        description: Operator to use for comparing the `headerName` with `value`.
        member_descriptions:
          EQUALS: Performs an exact comparison between the header value and specified
            string. `string === value`.
          NOT_EQUALS: Ensures the header value does not exactly match the specified
            string. `string !== value`.
          CONTAINS: Checks if the header value contains the specified string as a
            substring. `string.includes()`.
          NOT_CONTAINS: Verifies the header value does not contain the specified string
            as a substring. `!string.includes()`.
          STARTS_WITH: Validates that the header value begins with the specified string.
            `string.startsWith()`.
          NOT_STARTS_WITH: Validates that the header value does not begin with the
            specified string. `!string.startsWith()`.
          ENDS_WITH: Confirms the header value ends with the specified string. `string.endsWith()`.
          NOT_ENDS_WITH: Confirms the header value does not end with the specified
            string. `!string.endsWith()`.
          REGEX: Evaluates if the header value matches the specified regular expression
            pattern. `regex.test()`.
          NOT_REGEX: Evaluates if the header value does not match the specified regular
            expression pattern. `!regex.test()`.
    - fingerprint:
        name: Fingerprint
        members:
          - CHROME
          - FIREFOX
          - SAFARI
          - IOS
          - ANDROID
          - EDGE
          - QQ
          - RANDOM
          - RANDOMIZED
        values:
          - chrome
          - firefox
          - safari
          - ios
          - android
          - edge
          - qq
          - random
          - randomized
        description: Simulate the TLS fingerprint using the `uTLS` library or it generate
          randomly.
        member_descriptions:
          CHROME: Simulate TLS fingerprint of the `Chrome` browser.
          FIREFOX: Simulate TLS fingerprint of the `Firefox` browser.
          SAFARI: Simulate TLS fingerprint of the `Safari` browser.
          IOS: Simulate TLS fingerprint of the `iOS` browser.
          ANDROID: Simulate TLS fingerprint of the `Android` browser.
          EDGE: Simulate TLS fingerprint of the `Edge` browser.
          QQ: Simulate TLS fingerprint of the `QQ` browser.
          RANDOM: Rrandomly select one of the `up-to-date` browsers.
          RANDOMIZED: Generate a completely random and unique fingerprint (100% compatible
            with `TLS 1.3` using `X25519`).
    - provider:
        name: Provider
        members:
          - GITHUB
          - POCKETID
          - YANDEX
          - KEYCLOAK
          - GENERIC
          - TELEGRAM
        values:
          - github
          - pocketid
          - yandex
          - keycloak
          - generic
          - telegram
        description: OAuth2 authorization provider.
        member_descriptions:
          GITHUB: GitHub OAuth2 provider.
          POCKETID: Pocket ID OAuth2 provider.
          YANDEX: Yandex OAuth2 provider.
          KEYCLOAK: Keycloak OAuth2 provider.
          GENERIC: Generic OAuth2 provider.
          TELEGRAM: Telegram OAuth2 provider.
    - response_rules_version:
        name: ResponseRulesVersion
        members:
          - V1
        values:
          - '1'
        description: Response Rules Config Version.
        member_descriptions:
          V1: Response rules configuration version 1.
    - rules_operator:
        name: RulesOperator
        members:
          - AND
          - OR
        values:
          - AND
          - OR
        description: Operator to use for combining conditions in the rule.
        member_descriptions:
          AND: All conditions in the rule must match.
          OR: Any condition in the rule may match.
    - response_type:
        name: ResponseType
        members:
          - XRAY_JSON
          - XRAY_BASE64
          - MIHOMO
          - STASH
          - CLASH
          - SINGBOX
          - BROWSER
          - BLOCK
          - STATUS_CODE_404
          - STATUS_CODE_451
          - SOCKET_DROP
        values:
          - XRAY_JSON
          - XRAY_BASE64
          - MIHOMO
          - STASH
          - CLASH
          - SINGBOX
          - BROWSER
          - BLOCK
          - STATUS_CODE_404
          - STATUS_CODE_451
          - SOCKET_DROP
        description: Type of the response. Determines the type of `response` to be
          returned when the rule is matched.
        member_descriptions:
          XRAY_JSON: Return `subscription` in XRAY-JSON format. (Using `Xray Json`
            template).
          XRAY_BASE64: Return `subscription` in BASE64 encoded string. Compatible
            with most client application with Xray core.
          MIHOMO: Return `subscription` in Mihomo format. (Using `Mihomo` template).
          STASH: Return `subscription` in Stash format. (Using `Stash` template).
          CLASH: Return `subscription` in Clash format. (Using `Clash` template) Useful
            for client application that use Legacy Clash core.
          SINGBOX: Return `subscription` in Singbox format. (Using `Singbox` template)
            Format which is used by Singbox client application.
          BROWSER: Return `subscription` as browser format. The same as on `/info`
            route.
          BLOCK: '`Drop` request and return `403` status code.'
          STATUS_CODE_404: '`Drop` request and return `404` status code.'
          STATUS_CODE_451: '`Drop` request and return `451` status code.'
          SOCKET_DROP: '`Drop` the socket connection.'
    - security_layer:
        name: SecurityLayer
